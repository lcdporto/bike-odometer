CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="Bike_Odometer"
CONFIG_BT_DEVICE_APPEARANCE=1154


# Enable NVS for non-volatile storage of trips
# Settings still needed for RTC module
CONFIG_SETTINGS=y
CONFIG_NVS=y
CONFIG_SETTINGS_NVS=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_MPU_ALLOW_FLASH_WRITE=y

# ADC for battery voltage measurement
CONFIG_ADC=y
